# Mars crash. Physics (center-to-center unless noted; Earth R 3,959 mi, Mars R 2,106 mi, 0.107 Earths):
#   contact at 6,065 mi center; start 34.6M mi (closest Mars ever gets, 2003)
#   bigger than the full Moon: 220 x 2,106 = 463,000 mi center
#   tides = Moon's: 238,855 x (0.107/0.0123)^(1/3) = 491,000 mi center (10x at 228,000; 3000x at 34,000)
#   Earth's (fluid) Roche limit for Mars: 2.44 x 3,959 x (5.51/3.93)^(1/3) = 10,800 mi center (gap ~4,700)
#   geostationary satellites: 22,236 mi altitude
#   minimum impact speed = mutual escape speed: 11.2 km/s x sqrt(1.107 x 6,371/9,761) = 9.5 km/s = 21,300 mph
#   energy ~0.5 x 6.4e23 kg x (9.5 km/s)^2 = 3e31 J, ~70 million x Chicxulub (4e23 J)
#   Theia, the body thought to have hit Earth and made the Moon, was about the size of Mars
- id: mars-crash
  title: What if Mars crashed into Earth?
  hook: "What if {Mars} crashed into Earth?"
  category: space
  scene: harbor
  accent: "#e8845a"
  body:
    name: Mars
    radius_mi: 2106           # equatorial radius
    mass_earths: 0.107
    start_mi: 34600000        # as close as it ever gets (2003)
    flattening: 0.006
    surface: rocky            # mottled terrain and small polar caps instead of gas-giant bands
    bands: ["#cc7a4e", "#7a4a36", "#f2ece4"]   # rusty plains, dark regions, polar caps
    el_deg: 13                # a little higher than the harbor default (10) so the small disk clears the peak
    light_color: "#ffb08a"
