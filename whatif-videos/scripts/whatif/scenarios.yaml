# Temperature mode: the air itself changes by a fixed amount every second. Beats pin to temp_f.
- id: hotter-every-second
  title: What if it got 10 degrees hotter every second?
  hook: "What if it got 10 degrees {hotter} every second?"
  category: earth
  scene: boardwalk
  mode: temperature
  accent: "#ff9a4a"
  temperature: {start_f: 75, rate_f_per_s: 10}
  hud_label: TEMPERATURE
  impact_s: 57                # 645°F when the story ends
  beats:
    - {at_s: 0, label: A SUMMER EVENING}
    - {at_s: 3.8, line: "Every second, it gets 10 degrees hotter."}
    - {temp_f: 134, label: HOTTEST DAY EVER RECORDED, line: "Past 134: hotter than any day ever recorded."}   # Death Valley, 1913
    - {at_s: 10.0, line: "The grass dries out. Everyone runs for shade."}
    - {temp_f: 212, label: WATER BOILS, line: "At 212, the lake boils."}
    - {temp_f: 265, label: THE POWER FAILS, line: "The wiring cooks. The lights and rides die."}
    - {at_s: 24.5, line: "Balloons burst. Plastic bins slump and sag."}
    - {temp_f: 356, label: POPCORN POPS, line: "At 356, every kernel in the cart pops at once."}
    - {at_s: 32.6, line: "The leaves curl up and crisp."}
    - {temp_f: 451, label: PAPER BURNS BY ITSELF, line: "At 451, paper needs no spark."}
    - {at_s: 41.6, line: "The awnings and tents catch next."}
    - {at_s: 45.7, line: "Wood is close to its limit now."}
    - {temp_f: 572, label: WOOD BURNS BY ITSELF, line: "Wood goes at 572. Every tree, every board, at once."}
    - {temp_f: 621, label: LEAD MELTS, line: "At 621, lead melts."}
  final_line: "In 22 more seconds, it would be as hot as Venus."   # Venus averages 867°F
  outro: Hotter or colder next?
  outro_small: COMMENT BELOW
  teaser: Watch what happens at 451 👀
  question: Hotter or colder next?
  hashtags: [heatwave, temperature, science]

