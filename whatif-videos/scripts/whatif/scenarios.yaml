# Temperature mode, driven by distance: Earth's distance to the Sun shrinks 1% every second (0.99^t),
# and the average surface temperature follows distance^-1/2 from today's 59°F.
- id: sun-one-percent-closer
  title: What if Earth got 1% closer to the Sun every second?
  hook: "What if Earth got 1% {closer to the Sun} every second?"
  category: space
  scene: boardwalk
  mode: temperature
  accent: "#ffc45a"
  temperature: {start_f: 59, sun_factor_per_s: 0.99}
  hud_label: DISTANCE TO THE SUN
  impact_s: 57                # 0.564 of today's distance (52.5 million mi), average 231°F
  beats:
    - {at_s: 0, label: WHERE WE ARE TODAY}
    - {at_s: 3.8, line: "Every second, Earth gets 1% closer to the Sun."}
    - {au: 0.95, label: INNER EDGE OF THE HABITABLE ZONE}   # Kasting et al. 1993
    - {at_s: 7.9, line: "Just 5% closer, we leave the Sun's habitable zone."}
    - {temp_f: 92, label: AVERAGE IS A HEAT WAVE, line: "Earth's average temperature passes 90°F."}
    - {at_s: 16.4, line: "The crowd heads for the shade."}
    - {at_s: 20.5, line: "Every second, sunlight gets 2% stronger."}
    - {temp_f: 134, label: HOTTER THAN ANY RECORD, line: "On average, it's hotter than the hottest day ever recorded."}
    - {au: 0.723, label: PASSING VENUS'S ORBIT, line: "We pass the orbit of Venus."}
    - {au: 0.7071, label: SUNLIGHT TWICE AS STRONG}
    - {at_s: 36.4, line: "Sunlight is now twice as strong as today."}
    - {au: 0.6667, label: "THE SUN LOOKS 1.5× WIDER", line: "The Sun looks one and a half times wider."}
    - {at_s: 44.5, line: "The grass and trees are dry as straw."}
    - {at_s: 47.3, line: "Sunlight is now two and a half times as strong."}
    - {temp_f: 212, label: WATER BOILS, line: "At 212, the lake boils."}
  final_line: "At this rate, Earth would touch the Sun in 9 minutes."   # 0.99^t = 432,690 / 93M at t = 534 s
  outro: Where should we send Earth next?
  outro_small: COMMENT BELOW
  teaser: Watch the size of the Sun ☀️
  question: Where should we send Earth next?
  hashtags: [sun, space, science]

