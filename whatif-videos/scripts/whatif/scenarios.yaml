# What-if scenarios. Each one is a body falling toward Earth, ~65s long.
#
# The distance shrinks from start_mi to contact at an even pace (same time per halving),
# hitting at impact_s. Pin each beat to one of:
#   at_s: 12            seconds into the video
#   gap_mi: 34600000    when the gap between the surfaces reaches this
#   tide: 1             when its tides reach this many times the Moon's
#   event: steal        steal (it takes the Moon), recede / surge / flood (the sea),
#                       rings (Earth reaches its rings), impact
# A beat can set a subtitle (line), the milestone under the distance (label), or both.
# Facts are checked against NASA fact sheets; keep new ones just as careful.

- id: saturn-crash
  title: What if Saturn crashed into Earth?
  hook: "What if {Saturn} crashed into Earth?"
  category: space
  scene: harbor
  accent: "#f2c879"
  body:
    name: Saturn
    radius_mi: 37449          # equatorial radius
    mass_earths: 95.16
    start_mi: 746000000       # as close as it gets to Earth
    flattening: 0.098
    rings: [1.24, 2.27]       # C ring inner edge to A ring outer edge
    bands: ["#ecdcb4", "#c8a26a", "#a7aeb3"]
    ring_color: "#dccaa5"
  hud_label: DISTANCE TO SATURN
  impact_s: 57
  beats:
    - {at_s: 0, label: AS CLOSE AS IT EVER GETS}
    - {at_s: 3.8, line: "That bright dot is Saturn. It's heading straight for us."}
    - {gap_mi: 365000000, label: AS CLOSE AS JUPITER EVER GETS}
    - {at_s: 8.0, line: "Saturn is 95 times heavier than Earth."}
    - {at_s: 12.0, line: "But it's so light for its size, it would float in water."}
    - {at_s: 15.0, line: "Its rings are 170,000 miles across, and only about 30 feet thick."}
    - {gap_mi: 34600000, label: AS CLOSE AS MARS EVER GETS, line: "It's now as close as Mars ever gets."}
    - {at_s: 21.6, line: "You could see its rings without a telescope."}
    - {gap_mi: 8000000, label: BIGGER THAN THE FULL MOON, line: "Saturn now looks bigger than the full Moon."}
    - {tide: 1, label: TIDES AS STRONG AS THE MOON'S, line: "Its pull on our oceans now matches the Moon's."}
    - {at_s: 32.6, line: "Every time the distance halves, its tides get 8 times stronger."}
    - {event: steal, label: IT STEALS THE MOON, line: "Saturn's gravity pulls the Moon away from Earth."}
    - {at_s: 40.0, line: "The sea drains away from the shore..."}
    - {at_s: 42.6, line: "...then comes back hundreds of feet high."}
    - {gap_mi: 238855, label: WHERE THE MOON USED TO BE, line: "Saturn is now where the Moon used to be."}
    - {at_s: 49.8, line: "Its pull bends the ground itself. Volcanoes erupt everywhere."}
    - {event: rings, label: THE RINGS HIT, line: "We hit the rings first: ice moving at 40,000 mph."}
    - {at_s: 55.0, line: "Saturn's tides tear Earth apart."}
    - {event: impact, label: IMPACT}
  final_line: "Saturn has no surface. Earth just sinks in."
  outro: What should hit Earth next?
  outro_small: COMMENT BELOW
  teaser: Watch what happens to the Moon 🌙
  question: What should hit Earth next?
  hashtags: [whatif, saturn, space, astronomy, science]

